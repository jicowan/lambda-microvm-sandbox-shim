apiVersion: v1
kind: ServiceAccount
metadata: { name: agent-sandbox-ext, namespace: default }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: agent-sandbox-ext }
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes","sandboxes/status","sandboxes/finalizers"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates","sandboxwarmpools","sandboxclaims","sandboxtemplates/status","sandboxwarmpools/status","sandboxclaims/status","sandboxwarmpools/finalizers","sandboxclaims/finalizers"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["events","configmaps"]
    verbs: ["get","list","watch","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: agent-sandbox-ext }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-sandbox-ext }
subjects: [{ kind: ServiceAccount, name: agent-sandbox-ext, namespace: default }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agent-sandbox-ext, namespace: default }
spec:
  replicas: 1
  selector: { matchLabels: { app: agent-sandbox-ext } }
  template:
    metadata: { labels: { app: agent-sandbox-ext } }
    spec:
      serviceAccountName: agent-sandbox-ext
      nodeSelector: { kubernetes.io/arch: arm64 }
      containers:
        - name: extctl
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              aws s3 cp s3://${ARTIFACT_BUCKET}/extctl /tmp/extctl
              chmod +x /tmp/extctl
              exec /tmp/extctl
          env:
            - { name: AWS_REGION, value: ${AWS_REGION} }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
