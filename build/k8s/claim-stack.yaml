apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata: { name: mvm-template, namespace: default }
spec:
  podTemplate:
    spec:
      nodeSelector: { kubernetes.io/arch: arm64 }
      containers:
        - name: sandbox
          image: microvm-sandbox-shim
          resources:
            requests:
              memory: 2Gi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata: { name: mvm-pool, namespace: default }
spec:
  replicas: 1
  updateStrategy: { type: Recreate }
  sandboxTemplateRef: { name: mvm-template }
